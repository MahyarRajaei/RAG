[project]
name = "adan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MahyarRajaei", email = "mahyar.rajaei.mail@gmail.com" }
]
requires-python = ">=3.12.13"
dependencies = [
    "langchain>=1.4.1",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "tiktoken>=0.14.0",
]

[project.scripts]
adan = "adan:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]


